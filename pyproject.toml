[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghidra-mcp"
version = "0.2.5"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28.1,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ghidra_mcp*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: real end-to-end tests against large binaries (full analysis, PDB fetch)",
]
